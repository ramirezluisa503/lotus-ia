services:
  db:
    image: postgres:16
    container_name: lotusia_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: lotusia
      POSTGRES_PASSWORD: lotusia_dev
      POSTGRES_DB: lotusia
    ports:
      - "5432:5432"
    volumes:
      - lotusia_db_data:/var/lib/postgresql/data
      - ./backend/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lotusia -d lotusia"]
      interval: 5s
      timeout: 5s
      retries: 10

  pgadmin:
    image: dpage/pgadmin4
    container_name: lotusia_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@lotusia.com
      PGADMIN_DEFAULT_PASSWORD: lotusia_dev
    ports:
      - "5050:80"
    volumes:
      - lotusia_pgadmin_data:/var/lib/pgadmin
    depends_on:
      - db

volumes:
  lotusia_db_data:
  lotusia_pgadmin_data:
